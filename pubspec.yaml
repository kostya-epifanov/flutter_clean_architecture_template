name: clean_architecture_demo
description: Flutter app demonstrating Clean Architecture with Cubit, GetIt and Dio.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1

  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  equatable: ^3.0.0
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  bloc_test: ^10.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
