name: flutter_clean_template
description: Flutter app demonstrating Clean Architecture with Cubit, GetIt and Dio.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  equatable: ^3.0.0
  dio: ^5.11.1
  connectivity_plus: ^7.3.2
  logger: ^2.8.0

  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
