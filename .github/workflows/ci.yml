name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  FLUTTER_VERSION: 3.50.0
  MIN_COVERAGE: 90

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage

      - name: Check line coverage
        run: |
          coverage=$(awk -F: '/^LH:/ { hit += $2 } /^LF:/ { found += $2 } END { printf "%.1f", 100 * hit / found }' coverage/lcov.info)
          echo "Line coverage of lib/: $coverage% (minimum $MIN_COVERAGE%)" | tee -a "$GITHUB_STEP_SUMMARY"
          awk -v c="$coverage" -v min="$MIN_COVERAGE" 'BEGIN { exit !(c >= min) }'

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build apk --release
